<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDS Emulator in a GitHub page PWA!</title>
  <link rel="canonical" href="https://43trh.github.io/nds-emu-github-page-pwa/" />
  <link rel="manifest" href="/nds-emu-github-page-pwa/manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
 
  <h1>NDS Emulator in a GitHub page PWA!</h1>
  <p>upload a rom and give it a go!</p>
  <p>
    <input type="file" id="romfile"></input>
    <desmond-player></desmond-player>
  </p>
  <script>
      if (navigator.serviceWorker) {
        navigator.serviceWorker.register (
          '/nds-emu-github-page-pwa/sw.js',
          {scope: '/nds-emu-github-page-pwa/'}
        )
      }
  </script>
  <script src="js/desmond.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
